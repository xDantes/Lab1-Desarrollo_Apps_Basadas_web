name: CI                      

on:                           
  push:                       
    branches: [ main ]       
  pull_request:              
    branches: [ main ]

jobs:                        
  build:  
    runs-on: ubuntu-latest  
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lescocr
          POSTGRES_USER: lescocr
          POSTGRES_PASSWORD: lescocr
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lescocr -d lescocr"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:                 
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle     

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar y probar
        run: ./gradlew build
