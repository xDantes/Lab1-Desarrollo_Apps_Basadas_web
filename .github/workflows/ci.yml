name: CI                      

on:                           
  push:                       
    branches: [ main ]       
  pull_request:              
    branches: [ main ]

jobs:
  # Sin bloque "services": las pruebas de integración usan Testcontainers, que
  # levanta sus propios contenedores efímeros de Postgres y Mongo hablando
  # directo con el Docker del runner (ya viene instalado en ubuntu-latest).
  # Un servicio "postgres" estático aquí no lo usa ninguna prueba.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle     

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar y probar
        run: ./gradlew build
