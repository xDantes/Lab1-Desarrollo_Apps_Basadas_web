spring.application.name=lab1

# --- PostgreSQL (usuarios, cursos, lecciones, matriculas, pagos) ---
# Los valores por defecto coinciden con docker-compose.yml, asi que no hace
# falta ningun .env para levantar el proyecto localmente.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:lescocr}
spring.datasource.username=${POSTGRES_USER:lescocr}
spring.datasource.password=${POSTGRES_PASSWORD:lescocr}

# El esquema lo crea y versiona Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con lo que Flyway ya aplico.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# spring.flyway.out-of-order eliminado: las migraciones están en orden correcto
# (V3_1 se intercala naturalmente entre V3 y V4 en el ordenamiento de Flyway).

# --- JWT (stateless auth) ---
# Mínimo 32 bytes (256 bits) para HS256. En producción sobreescribir con variable de entorno.
app.jwt.secret=${JWT_SECRET:lescocr-jwt-dev-secret-key-32-bytes-minimum-change-in-prod}
app.jwt.expiration-ms=86400000

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- MongoDB (diccionario LESCO, recursos multimedia, comentarios) ---
spring.data.mongodb.uri=mongodb://${MONGO_ROOT_USER:lescocr}:${MONGO_ROOT_PASSWORD:lescocr}@localhost:${MONGO_PORT:27017}/${MONGO_DB:lescocr}?authSource=admin
