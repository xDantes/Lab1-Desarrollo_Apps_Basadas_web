# ===================================================================
# Perfil de Producción (application-prod.properties)
# ===================================================================
# Todos los secretos y configuraciones sensibles se inyectan estrictamente
# mediante variables de entorno del proveedor de nube (Render, Railway, etc.).
# NUNCA colocar valores quemados o secretos reales en este archivo.

spring.application.name=lab1

# --- PostgreSQL (gestionado en la nube: Render / Neon / Supabase) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- Hibernate y Flyway ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- JWT (Token seguro generado criptográficamente, mín. 32 bytes) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS (URL pública con HTTPS de la SPA desplegada) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- MongoDB (gestionado en MongoDB Atlas con SSL/TLS) ---
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# --- Documentación Swagger UI en producción ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
